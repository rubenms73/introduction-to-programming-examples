name: Java examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        jdk: ['11', '17', '21', '25']
        # macOS runners are scarce: test macOS with one JDK only.
        exclude:
          - os: macos-latest
            jdk: '11'
          - os: macos-latest
            jdk: '17'
          - os: macos-latest
            jdk: '25'
    runs-on: ${{ matrix.os }}
    # When no macOS runner is available, the job is cancelled; that must not
    # fail the run, while Ubuntu and Windows still decide the result.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, run and check every Java example
        run: python tools/check_examples.py
